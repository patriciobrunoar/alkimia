<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Success Case — Alkimia</title>
<meta name="robots" content="noindex">

<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="alternate icon" type="image/png" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">

<meta name="description" content="Watch our latest success case.">

<link rel="stylesheet" href="../styles.css">
<style>
:root{
  --alk-purple:#6b4fa1;
  --alk-purple-deep:#5a4287;
  --alk-heading:#5c4a8b;
  --alk-body:#5c5670;
  --alk-lavender:#e9e4f4;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-family-body);color:#fff;-webkit-font-smoothing:antialiased;min-height:100vh;position:relative;overflow-x:hidden}
body.gate-open{overflow:hidden;height:100vh}
.alk-logo{fill:#fff;display:block}
.alk-logo use{fill:#fff}
img{max-width:100%;display:block}

.cases-bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(150deg,rgba(90,66,135,.9),rgba(58,38,92,.96)),url("../assets/bg4.jpg") center/cover;background-color:#5a4287}

.cases-logo{position:fixed;top:24px;left:24px;width:104px;z-index:5}
.cases-logo .alk-logo{width:100%;height:auto}

.cases-main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:120px 24px 60px}
.cases-video-wrap{width:100%;max-width:960px;border-radius:18px;overflow:hidden;box-shadow:var(--shadow-lg);background:#000}
.cases-video-wrap video{width:100%;display:block;aspect-ratio:16/9;background:#000}

.gate-overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(58,38,92,.94);backdrop-filter:blur(6px);transition:opacity .4s ease;opacity:1}
.gate-overlay.hidden{opacity:0;pointer-events:none}
.gate-card{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:44px 36px;box-shadow:var(--shadow-xl);text-align:center}
.gate-brand{width:96px;margin:0 auto 24px}
.gate-brand .alk-logo{width:100%;height:auto}
.gate-brand .alk-logo,.gate-brand .alk-logo use{fill:var(--alk-purple)}
.gate-card h1{font-size:22px;font-weight:700;color:var(--alk-heading);line-height:1.3;margin-bottom:10px}
.gate-card p{font-size:15px;line-height:1.5;color:var(--alk-body);margin-bottom:26px}
.gate-form{display:flex;flex-direction:column;gap:14px}
.gate-form input{font-family:inherit;font-size:15px;color:var(--alk-heading);padding:14px 16px;border:1px solid #d8d2e6;border-radius:var(--radius-md);background:#fff;transition:border-color var(--transition-base)}
.gate-form input:focus{outline:none;border-color:var(--alk-purple)}
.gate-form button{margin-top:4px;background:var(--alk-purple);color:#fff;font-family:inherit;font-size:16px;font-weight:600;border:none;border-radius:var(--radius-md);padding:14px;cursor:pointer;transition:background var(--transition-base)}
.gate-form button:hover{background:var(--alk-purple-deep)}
.gate-form button:disabled{opacity:.7;cursor:default}

@media(max-width:600px){
  .cases-logo{top:18px;left:18px;width:88px}
  .gate-card{padding:34px 24px}
}
</style>
</head>
<body>

<div class="cases-bg"></div>

<a href="../index.html#home" class="cases-logo" aria-label="Alkimia home"><svg class="alk-logo" viewBox="0 0 416.29 206.88"><use href="#alkimiaLockup"/></svg></a>

<main class="cases-main">
  <div class="cases-video-wrap">
    <video id="casesVideo" controls playsinline preload="none">
      <source src="https://myalkimia.com/assets/cases/988.mp4" type="video/mp4">
    </video>
  </div>
</main>

<div class="gate-overlay" id="gateOverlay">
  <div class="gate-card">
    <div class="gate-brand"><svg class="alk-logo" viewBox="0 0 416.29 206.88"><use href="#alkimiaLockup"/></svg></div>
    <h1>Watch our latest success case</h1>
    <p>Enter your details to unlock the video.</p>
    <form id="gateForm" class="gate-form">
      <input type="hidden" name="access_key" value="55ab5cdb-7b51-4089-9cd0-5398a8364d3f">
      <input type="hidden" name="subject" value="New success case video lead from myalkimia.com/cases">
      <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">
      <input type="text" name="name" placeholder="Name" required autocomplete="name">
      <input type="email" name="email" placeholder="Email" required autocomplete="email">
      <button type="submit">Watch the video</button>
    </form>
  </div>
</div>

<script>
document.body.classList.add('gate-open');

const gateOverlay=document.getElementById('gateOverlay');
const gateForm=document.getElementById('gateForm');
const video=document.getElementById('casesVideo');

gateForm.addEventListener('submit',async(e)=>{
  e.preventDefault();
  const btn=gateForm.querySelector('button');
  const originalText=btn.textContent;
  btn.disabled=true;
  btn.textContent='Please wait…';
  try{
    const res=await fetch('https://api.web3forms.com/submit',{
      method:'POST',
      headers:{'Accept':'application/json'},
      body:new FormData(gateForm)
    });
    const data=await res.json();
    if(data.success){
      document.body.classList.remove('gate-open');
      gateOverlay.classList.add('hidden');
      video.load();
      video.play().catch(()=>{});
    }else{
      btn.disabled=false;
      btn.textContent=originalText;
      alert('Something went wrong sending your details. Please try again or email contact@myalkimia.com directly.');
    }
  }catch(err){
    btn.disabled=false;
    btn.textContent=originalText;
    alert('Something went wrong sending your details. Please try again or email contact@myalkimia.com directly.');
  }
});
</script>

</html>
