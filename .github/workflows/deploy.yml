name: Deploy to DreamHost

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH (rsync)
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: >-
            -avzr --delete
            --exclude=".git*"
            --exclude=".github"
            --exclude=".htaccess"
            --exclude=".tmb"
            --exclude=".dh-diag"
            --exclude="*.bak-*"
            --exclude="assets/cases"
          path: ./
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Disable directory listings
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 600 /dev/null ~/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/deploy_key
          ssh -i ~/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && touch .htaccess && \
            (grep -qxF 'Options -Indexes' .htaccess || \
             { cp .htaccess .htaccess.bak-\$(date +%Y%m%d%H%M%S) && printf '\nOptions -Indexes\n' >> .htaccess; }) && \
            cat .htaccess"
          rm -f ~/deploy_key
